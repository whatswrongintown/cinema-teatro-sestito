[build]
command = 'hugo'
publish = 'public'

[build.environment]
HUGO_VERSION = '0.170.1'
# Keep processed images in Hugo's cacheDir, which on Netlify is
# /opt/build/cache/hugo_cache and is kept between builds (resources/ is not).
HUGO_CACHES_IMAGES_DIR = ':cacheDir/images'

[context]
[context.branch-deploy]
command = 'hugo -F -b $DEPLOY_PRIME_URL'

[context.deploy-preview]
command = 'hugo -F -b $DEPLOY_PRIME_URL'

[context.production]
[context.production.environment]
HUGO_ENV = 'production'

# Long caching. Pages link CSS and JS only by their fingerprinted names (a new
# content hash on every change, see css-bundle.html and asset.html), so they
# never need rechecking. Font names have no hash: give a changed font a new
# file name. Poster images are final; 30 days, then rechecked.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/manifesti/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
