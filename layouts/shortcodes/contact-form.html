<section class="contact-section" aria-labelledby="contact-form-title">
  <h2 id="contact-form-title">Condividi un ricordo</h2>
  <p>I messaggi sono privati e non saranno pubblicati senza un accordo separato.</p>

  <form name="ricordi-cinema" method="POST" action="{{ "grazie/" | relURL }}" data-netlify="true" netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="ricordi-cinema">
    <p class="form-honeypot" hidden>
      <label>Lascia vuoto questo campo: <input name="bot-field"></label>
    </p>

    <div class="form-field">
      <label for="contact-name">Nome <span>(facoltativo)</span></label>
      <input id="contact-name" name="name" type="text" autocomplete="name">
    </div>

    <div class="form-field">
      <label for="contact-email">Email per una risposta <span>(facoltativa)</span></label>
      <input id="contact-email" name="email" type="email" autocomplete="email">
    </div>

    <div class="form-field">
      <label for="contact-message">Il tuo messaggio</label>
      <textarea id="contact-message" name="message" rows="6" required></textarea>
    </div>

    <div class="form-checkbox">
      <input id="publication-followup" name="publication-followup" type="checkbox" value="yes">
      <label for="publication-followup">Puoi ricontattarmi per parlare di un'eventuale pubblicazione separata del mio ricordo. Se desideri essere ricontattato, inserisci anche l'email.</label>
    </div>

    <p class="form-privacy">Leggi l'<a href="{{ "privacy/" | relURL }}">informativa sulla privacy</a> prima di inviare il messaggio.</p>
    <button type="submit">Invia il messaggio</button>
  </form>
</section>
