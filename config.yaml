baseurl: https://cinemateatrosestito.com/
locale: it-IT
title: Cinema Teatro Sestito
enableRobotsTXT: true
# Term titles (categories, tags): capital first letter only, the rest as
# written in front matter (style guide C2; checked against Hugo 0.170.1).
titleCaseStyle: firstupper
permalinks:
  articoli: /:year/:month/:day/:slug/
  archivio: /:year/:month/:day/:slug/
  eventi: /:year/:month/:day/:slug/
  programmazione-storica: /:year/:month/:day/:slug/
menu:
  main:
    - name: Storie
      pageRef: /articoli
      weight: 10
    - name: Programmazione
      pageRef: /programmazione-storica
      weight: 20
    - name: Manifesti
      pageRef: /posters
      weight: 30
    - name: Archivio
      pageRef: /archivio
      weight: 40
    - name: Eventi
      pageRef: /eventi
      weight: 50
    - name: Il progetto
      pageRef: /progetto
      weight: 60
      params:
        cta: true
frontmatter:
  lastmod:
    - lastmod
params:
  description: "Un sito dedicato al Cinema di San Vito sullo Ionio: dalle origini alla chiusura, i film, le storie e i ricordi di una cara istituzione del paese."
  # House share card (U17): pages without their own image or poster; source in docs/share-card/.
  defaultImage: "social-card.png"
  defaultImageAlt: "Cinema Teatro Sestito, San Vito sullo Ionio: il nome del cinema e tre manifesti della raccolta"
  favicon: images/icons/favicon.png
  instagram: whatswrongintown
  github: whatswrongintown/cinema-teatro-sestito
  email: whatswrongintown@gmail.com
  copyright: © 2026 Vito Sestito
  copyrightUrl: https://cinemateatrosestito.com/
markup:
  defaultMarkdownHandler: goldmark
  goldmark:
    renderer:
      unsafe: true
privacy:
  googleAnalytics:
    disable: true
    respectDoNotTrack: true
  youtube:
    disable: false
    privacyEnhanced: true
module:
  mounts:
    - source: content
      target: content
    - source: static
      target: assets
    - source: static
      target: static
